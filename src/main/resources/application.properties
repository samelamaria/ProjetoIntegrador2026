spring.application.name=orcamento
# Compartilhado com o Docker Compose; variaveis de ambiente podem sobrescrever.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:orcamento}?connectionTimeZone=America/Sao_Paulo
spring.datasource.username=${MYSQL_USER:orca}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
